<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف عمرو وريم</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600&family=Playfair+Display:ital,wght@1,400;1,600&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfbfa; /* أوف وايت راقي جداً */
            --cream-card: #f5f2eb; /* بيج ناعم وهادي للهوامش والكروت */
            --text-main: #3a3a3a; /* رمادي دافئ شيك جداً للكتابة */
            --accent-gold: #9c8660; /* لمسة ذهبية مطفية راقية */
        }
        
        body {
            font-family: 'Tajawal', 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            text-align: center;
            overflow-x: hidden;
        }

        /* الجزء العلوي الفخم */
        .hero-section {
            padding: 100px 20px 60px;
            background: linear-gradient(rgba(252,251,250,0.85), rgba(252,251,250,1)), url('Chapter4.jpg') no-repeat center/cover;
        }
        
        .hero-section h1 {
            font-family: 'Playfair Display', 'Cairo', serif;
            font-size: 3rem;
            font-weight: 300;
            color: var(--accent-gold);
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .hero-section p {
            font-size: 1.1rem;
            color: #777;
            font-style: italic;
            margin-bottom: 30px;
        }

        .wedding-date {
            font-size: 1.3rem;
            color: var(--text-main);
            border-top: 1px solid var(--accent-gold);
            border-bottom: 1px solid var(--accent-gold);
            display: inline-block;
            padding: 8px 30px;
            font-weight: 400;
        }

        /* العداد التنازلي الرايق */
        .countdown-title {
            color: var(--accent-gold);
            font-weight: 400;
            margin-top: 50px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        
        .countdown-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto 60px;
            max-width: 350px;
        }
        
        .time-box {
            flex: 1;
            padding: 10px;
        }
        
        .time-box span {
            display: block;
            font-size: 2rem;
            font-weight: 300;
            color: var(--text-main);
        }
        
        .time-box label {
            font-size: 0.8rem;
            color: #999;
        }

        /* قسم الحكاية الأنيق */
        .section-title {
            color: var(--accent-gold);
            font-size: 1.8rem;
            font-weight: 400;
            margin-bottom: 40px;
            position: relative;
        }
        
        .section-title::after {
            content: '';
            display: block;
            width: 40px;
            height: 1px;
            background: var(--accent-gold);
            margin: 10px auto 0;
        }

        .story-container {
            max-width: 550px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .chapter-card {
            background: white;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 45px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            border: 1px solid #f0ede6;
        }
        
        .chapter-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }
        
        .chapter-content {
            padding: 25px 20px;
            text-align: right;
        }
        
        .chapter-content h3 {
            color: var(--accent-gold);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            font-weight: 500;
        }
        
        .chapter-content p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
            margin: 0;
        }

        /* تفاصيل الفرح */
        .details-container {
            background-color: var(--cream-card);
            padding: 50px 20px;
            margin: 60px 0;
        }
