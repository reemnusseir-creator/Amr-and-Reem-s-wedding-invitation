<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr & Reem's Wedding</title>
    <style>
        body { margin: 0; font-family: 'Georgia', serif; text-align: center; background: #fdfaf6; }
        .page { display: none; padding: 20px; }
        .active { display: block; }
        img { max-width: 100%; height: auto; border-radius: 15px; margin-bottom: 10px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #8e9e85; color: white; border: none; border-radius: 5px; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #6f7d67; }
        .wish-box { margin-top: 40px; padding: 20px; background: #edeae4; border-radius: 15px; }
        .footer-text { margin-top: 20px; font-style: italic; color: #555; }
    </style>
</head>
<body>

    <!-- صفحة الظرف -->
    <div id="envelope-page" class="page active">
        <img src="1000136712.png" alt="Envelope">
        <button onclick="showNext()">CLICK TO OPEN</button>
    </div>

    <!-- صفحة الـ Story -->
    <div id="story-page" class="page">
        <img src="1000136713.png" alt="Wedding Announcement">
        <img src="1000135288.jpg" alt="Story 1">
        <img src="1000135289.jpg" alt="Story 2">
        <img src="1000136714.png" alt="Blessings">
        <img src="1000135290.jpg" alt="Final Scene">
        
        <div id="countdown" style="margin:20px; font-weight: bold;">Countdown: July 25th, 2026</div>
        
        <a href="رابط_اللوكيشن_هنا" target="_blank">
            <button>View Wedding Venue (Villa Bahari)</button>
        </a>
        
        <div class="wish-box">
            <h3>Leave a Wish for Us</h3>
            <p>Your kind words mean the world to us.</p>
            <a href="رابط_الـ_Google_Form_هنا" target="_blank">
                <button>Send Your Wishes</button>
            </a>
        </div>
        
        <p class="footer-text">We look forward to celebrating with you!</p>
    </div>

    <script>
        function showNext() {
            document.getElementById('envelope-page').classList.remove('active');
            document.getElementById('story-page').classList.add('active');
        }
    </script>
</body>
</html>
