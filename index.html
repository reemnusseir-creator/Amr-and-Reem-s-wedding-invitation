<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr & Reem Wedding</title>
    <style>
        body { margin: 0; background: #05160a; color: #d4af37; font-family: 'Times New Roman', serif; overflow-x: hidden; }
        
        /* الظرف الأخضر المطرّز */
        #envelope {
            position: fixed; inset: 0; background: #0f2e1a;
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            transition: 1s; cursor: pointer; border: 15px double #c5a059;
        }
        .seal {
            width: 120px; height: 120px; background: #8b0000; color: #ffd700;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 0 25px #ffd700; border: 2px solid #ffd700;
        }

        /* خلفية خضراء زمردية بتلمع */
        .main-page { 
            padding: 40px; text-align: center; 
            background: radial-gradient(circle at center, #1b4b2e 0%, #050d06 100%); 
            min-height: 100vh;
        }

        /* تنظيم الصور (الستوري) */
        .story-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; padding: 20px; max-width: 1000px; margin: auto;
        }
        .story-card { 
            border: 1px solid #c5a059; padding: 15px; background: rgba(255,255,255,0.03);
            transition: 0.5s; cursor: pointer;
        }
        .story-card:hover { transform: scale(1.05); border-color: #fff; }
