<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف ريم وعمرو</title>
    <style>
        :root {
            --primary: #d4af37;
            --dark-green: #05160a;
            --emerald: #1b4b2e;
            --gold-gradient: linear-gradient(135deg, #ffd700 0%, #b38f37 100%);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-green);
            color: var(--primary);
            font-family: 'Times New Roman', serif;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* تأثير تساقط أوراق الورد */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            background: radial-gradient(#d4af37, #b38f37);
            border-radius: 100% 0 100% 100%;
            opacity: 0.7;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-10px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* هيكل الظرف ثلاثي الأبعاد الاحترافي */
        .envelope-wrapper {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f2e1a 0%, #050d06 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: all 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 15px double var(--primary);
        }
        .envelope-main {
            position: relative;
            width: 320px;
            height: 220px;
            background: #092212;
            border: 2px solid var(--primary);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }
        /* غطاء الظرف السفلي والجانبي كخدعة بصرية */
        .envelope-main::before {
            content: '';
            position: absolute;
            bottom: 0; right: 0; left: 0; top: 40%;
            background: #0d311b;
            border-top: 1px solid rgba(212,175,55,0.3);
            clip-path: polygon(0 100%, 50% 0, 100% 100%);
            z-index: 2;
        }
        /* الختم الشمعي الملكي */
        .seal-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .seal-container:hover {
            transform: translate(-50%, -50%) scale(1.1);
        }
        .wax-seal {
            width: 100px;
            height: 100px;
            background: radial-gradient(#8b0000 40%, #5a0000 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffd700;
            font-size: 26px;
            font-weight: bold;
            border: 3px dashed #ffd700;
            box-shadow: 0 0 30px #ffd700, inset 0 0 15px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        /* صفحة الدعوة الرئيسية الفخمة */
        .main-container {
            padding: 60px 20px;
            text-align: center;
            background: radial-gradient(circle at center, var(--emerald) 0%, var(--dark-green) 100%);
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
        }

        h1.wedding-title {
            font-size: 45px;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .date-text {
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 40px;
            color: #eee;
        }

        /* معرض الصور والقصة - هيكل المربعات المطور */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 35px;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .story-card {
            background: rgba(15, 46, 26, 0.4);
            border: 2px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: transform 0.4s, box-shadow 0.4s;
            position: relative;
            overflow: hidden;
        }
        .story-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 35px rgba(214,175,55,0.2);
        }
        .story-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(214,175,55,0.1), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
            pointer-events: none;
        }
        .story-card:hover::before {
            left: 100%;
            top: 100%;
        }
        .story-card img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid rgba(214,175,55,0.3);
        }

        /* أزرار اللوكيشن والتحكم الفخمة */
        .btn-gold {
            background: var(--gold-gradient);
            color: #000;
            padding: 18px 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 20px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 30px;
            box-shadow: 0 5px 20px rgba(214,175,55,0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }
        .btn-gold:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(214,175,55,0.6);
        }

        /* صندوق الأمنيات (الويشز) */
        .wishes-section {
            margin-top: 80px;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px 20px;
            border-top: 2px solid var(--primary);
            border-bottom: 2px solid var(--primary);
        }
        .wishes-section h2 {
            font-size: 30px;
            margin-bottom: 20px;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wishes-form textarea {
            width: 100%;
            max-width: 700px;
            height: 120px;
            padding: 15px;
            background: rgba(5, 22, 10, 0.8);
            color: #fff;
            border: 1px solid var(--primary);
            border-radius: 8px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }
        .wishes-form textarea:focus {
            outline: none;
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <!-- تشغيل الموسيقى الخلفية المتكررة -->
    <audio id="myAudio" src="Swany.mp3" loop></audio>

    <!-- تأثير الورد المتساقط -->
    <div class="petals-container" id="petals"></div>

    <!-- واجهة الظرف ثلاثي الأبعاد بالختم الملكي -->
    <div class="envelope-wrapper" id="envelopeWrapper">
        <div class="envelope-main">
            <div class="seal-container" onclick="openEnvelope()">
                <div class="wax-seal">R & A</div>
            </div>
        </div>
    </div>

    <!-- محتوى الدعوة بعد الفتح -->
    <div class="main-container">
        <h1 class="wedding-title">Wedding of Reem & Amr</h1>
        <p class="date-text">25 July 2026 | 06:00 PM</p>

        <!-- شبكة عرض الصور الأربعة بالكامل بدون نقص -->
        <div class="story-grid">
            <div class="story-card"><img src="1781194288956.jpeg" alt="Reem & Amr Wedding 1"></div>
            <div class="story-card"><img src="1781194320400.jpeg" alt="Reem & Amr Wedding 2"></div>
            <div class="story-card"><img src="1781196701497.jpeg" alt="Reem & Amr Wedding 3"></div>
            <div class="story-card"><img src="1781196975519.jpeg" alt="Reem & Amr Wedding 4"></div>
        </div>

        <!-- زر الانتقال للوكيشن القاعة الجغرافي -->
        <a href="https://maps.app.goo.gl/qVDhujncTiB6yjYX6?g_st=ac" class="btn-gold">اضغطي هنا للوكيشن القاعة</a>

        <!-- نظام إرسال أمنيات وتبريكات المهنئين -->
        <div class="wishes-section">
            <h2>شاركينا أجمل الأمنيات</h2>
            <form class="wishes-form" action="https://formspree.io/f/mbdeanjp" method="POST">
                <textarea name="message" placeholder="أكتبي أمنيتك أو تهنئتك هنا الحاضرة في قلوبنا..." required></textarea><br>
                <button type="submit" class="btn-gold" style="padding: 12px 35px; font-size: 16px; margin-top: 15px;">إرسال التهنئة</button>
            </form>
        </div>
    </div>

    <script>
        // دالة فتح الظرف المطور مع تشغيل الصوت
        function openEnvelope() {
            const audio = document.getElementById('myAudio');
            audio.play().catch(function(error) {
                console.log("Audio playback failed:", error);
            });
            
            const wrapper = document.getElementById('envelopeWrapper');
            wrapper.style.opacity = '0';
            wrapper.style.transform = 'scale(0.8) rotateX(20deg)';
            setTimeout(() => {
                wrapper.style.display = 'none';
            }, 1500);

            // تشغيل تأثير تساقط الورد فور الفتح
            createPetals();
        }

        // صناعة أوراق الورد عشوائياً وتوزيعها حركياً
        function createPetals() {
            const container = document.getElementById('petals');
            const petalCount = 40;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.width = Math.random() * 15 + 10 + 'px';
                petal.style.height = Math.random() * 15 + 10 + 'px';
                petal.style.animationDuration = Math.random() * 3 + 4 + 's';
                petal.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(petal);
            }
        }
    </script>
</body>
</html>
