<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Amr & Reem Wedding Invitation</title>
    <style>
        /* ستايل الخلفية الفخمة */
        body { margin: 0; background: #05160a; color: #d4af37; font-family: 'Times New Roman', serif; overflow-x: hidden; }
        
        /* الظرف الأخضر المطرّز */
        #envelope {
            position: fixed; inset: 0; background: #0f2e1a;
            display: flex; justify-content: center; align-items: center; z-index: 9999;
            transition: 1s; cursor: pointer; border: 15px double #c5a059;
        }
        .seal {
            width: 120px; height: 120px; background: #8b0000; color: #ffd700;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 0 25px #ffd700; border: 2px solid #ffd700;
        }

        /* صفحة الدعوة الرئيسية */
        .main-page { padding: 50px 20px; text-align: center; background: radial-gradient(circle at center, #1b4b2e 0%, #050d06 100%); min-height: 100vh; }
        
        /* الصور والقصة (مربعات منظمة) */
        .story-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; max-width: 1100px; margin: 40px auto; }
        .card { border: 2px solid #c5a059; padding: 15px; background: rgba(0,0,0,0.3); transition: 0.3s; }
        .card:hover { transform: scale(1.03); }
        .card img { width: 100%; height: 300px; object-fit: cover; border-radius: 5px; }

        /* الأزرار واللوكيشن */
        .btn { background: #c5a059; color: #000; padding: 15px 40px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 30px; font-size: 18px; }
        
        h1 { font-size: 45px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <audio id="myAudio" src="Swany.mp3" loop></audio>

    <div id="envelope" onclick="document.getElementById('myAudio').play(); this.style.display='none'">
        <div class="seal">R&A</div>
    </div>

    <div class="main-page">
        <h1>Wedding of Reem & Amr</h1>
        <p style="font-size: 22px;">25 July 2026 | 06:00 PM</p>

        <div class="story-container">
            <div class="card"><img src="1781194288956.jpeg"><p>لقاؤنا الأول</p></div>
            <div class="card"><img src="1781194320400.jpeg"><p>حكايتنا</p></div>
        </div>

        <a href="https://maps.google.com" class="btn">اضغطي هنا للوكيشن القاعة</a>

        <div style="margin-top: 60px;">
            <h3>شاركينا أجمل الأمنيات</h3>
            <form action="https://formspree.io/f/mbdeanjp" method="POST">
                <textarea name="message" placeholder="اكتبي تهنئتك لنا..." style="width: 80%; height: 100px; padding: 10px; background: rgba(0,0,0,0.3); color: #d4af37; border: 1px solid #c5a059;"></textarea><br>
                <button type="submit" class="btn">إرسال التهنئة</button>
            </form>
        </div>
    </div>

</body>
</html>
