<<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Wedding of Reem & Amr</title>
    <style>
        body { margin: 0; background: #fdfaf6; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        /* الظرف */
        #envelope { width: 300px; height: 200px; background: #dcd0c0; position: relative; cursor: pointer; transition: 1s; }
        .seal { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: #c5a059; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* الكارت اللي بيظهر (Glassmorphism) */
        #invitation { display: none; width: 85%; max-width: 450px; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); padding: 40px; border-radius: 20px; border: 1px solid #dcd0c0; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        .fade-in { animation: fadeIn 2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <audio id="music" src="Swany.mp3" loop></audio>

    <div id="envelope" onclick="openInvitation()">
        <div class="seal">R&A</div>
    </div>

    <div id="invitation" class="fade-in">
        <h2 style="color: #5c4d44;">Wedding Invitation</h2>
        <h1 style="color: #c5a059;">ريم & عمرو</h1>
        <p>يسعدنا دعوتكم لمشاركتنا ليلة العمر</p>
        <hr style="border: 0; border-top: 1px solid #dcd0c0; margin: 20px 0;">
        <p>25 July 2026</p>
        <a href="https://maps.app.goo.gl/qVDhujncTiB6yjYX6?g_st=ac" style="display:block; margin-top:20px; color:#c5a059; text-decoration:none; font-weight:bold;">📍 موقع القاعة (Villa Bashari)</a>
    </div>

    <script>
        function openInvitation() {
            document.getElementById('envelope').style.display = 'none';
            document.getElementById('invitation').style.display = 'block';
            document.getElementById('music').play();
        }
    </script>
</body>
</html>
