<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Amr and Reem — Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&family=Jost:wght@300;400&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ivory: #FAF7F2;
    --sage: #8A9E85;
    --sage-light: #C5D4C0;
    --gold: #C9A96E;
    --mocha: #6B5544;
    --text: #3D3530;
  }

  body {
    background: var(--ivory);
    font-family: 'Jost', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── PARTICLE CANVAS ── */
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  /* ── OPENING SCREEN ── */
  #opening {
    position: fixed;
    inset: 0;
    background: var(--ivory);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 900;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  #opening.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .opening-names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3.5rem, 12vw, 7rem);
    color: var(--mocha);
    line-height: 1;
    opacity: 0;
    transform: translateY(20px);
    animation: riseIn 1.2s ease forwards 0.6s;
  }
  .opening-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: var(--sage);
    letter-spacing: 0.12em;
    margin-top: 0.6rem;
    opacity: 0;
    animation: riseIn 1s ease forwards 1.4s;
  }
  .opening-divider {
    width: 60px;
    height: 1px;
    background: var(--gold);
    margin: 1.2rem auto;
    opacity: 0;
    animation: riseIn 1s ease forwards 1.8s;
  }
  .opening-date {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    letter-spacing: 0.35em;
    color: var(--mocha);
    opacity: 0;
    animation: riseIn 1s ease forwards 2s;
  }
  .open-btn {
    margin-top: 2.8rem;
    padding: 0.75rem 2.5rem;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--mocha);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    letter-spacing: 0.25em;
    font-size: 0.78rem;
    cursor: pointer;
    transition: background 0.3s, color 0.3s;
    opacity: 0;
    animation: riseIn 1s ease forwards 2.4s;
  }
  .open-btn:hover { background: var(--gold); color: #fff; }

  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ── MAIN INVITATION ── */
  #invitation {
    display: none;
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }
  #invitation.visible { display: block; }

  /* header */
  .inv-header {
    text-align: center;
    padding: 3rem 1rem 2rem;
    position: relative;
  }
  .inv-eyebrow {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.4em;
    color: var(--sage);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }
  .inv-names {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3rem, 10vw, 5.5rem);
    color: var(--mocha);
    line-height: 1.1;
  }
  .inv-ampersand {
    display: block;
    font-size: 0.6em;
    color: var(--gold);
    margin: -0.3em 0;
  }
  .inv-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--sage);
    font-size: 1.15rem;
    margin-top: 0.8rem;
    letter-spacing: 0.05em;
  }

  /* botanical SVG dividers */
  .botanical {
    display: block;
    margin: 1.5rem auto;
    opacity: 0.6;
  }

  /* sections */
  .section {
    text-align: center;
    margin: 2.5rem 0;
    padding: 2rem 1.5rem;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(197,212,192,0.4);
    border-radius: 2px;
  }
  .section-label {
    font-family: 'Jost', sans-serif;
    font-size: 0.65rem;
    letter-spacing: 0.45em;
    color: var(--sage);
    text-transform: uppercase;
    margin-bottom: 0.8rem;
  }
  .section-main {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--mocha);
    font-weight: 300;
    line-height: 1.4;
  }
  .section-sub {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.82rem;
    color: var(--sage);
    letter-spacing: 0.15em;
    margin-top: 0.5rem;
  }
  .section-note {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 0.95rem;
    margin-top: 0.6rem;
  }

  /* countdown */
  .countdown-grid {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }
  .countdown-unit { text-align: center; }
  .countdown-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 6vw, 3rem);
    color: var(--mocha);
    line-height: 1;
  }
  .countdown-label {
    font-family: 'Jost', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: var(--sage);
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  /* map btn */
  .map-btn {
    display: inline-block;
    margin-top: 1.2rem;
    padding: 0.6rem 2rem;
    border: 1px solid var(--sage);
    color: var(--sage);
    font-family: 'Jost', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.3em;
    text-decoration: none;
    transition: background 0.3s, color 0.3s;
  }
  .map-btn:hover { background: var(--sage); color: #fff; }

  /* wishes form */
  .wishes-section {
    text-align: center;
    margin: 2.5rem 0;
    padding: 2.5rem 1.5rem;
    background: rgba(255,255,255,0.6);
    border: 1px solid rgba(197,212,192,0.4);
    border-radius: 2px;
  }
