<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Amr & Reem Wedding Invitation</title>
    <style>
        body { margin: 0; background: #011409; color: #c5a059; font-family: 'Georgia', serif; }
        
        /* الظرف الفخم */
        #envelope {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #062413; /* أخضر ملكي */
            display: flex; justify-content: center; align-items: center; z-index: 999;
            transition: 1.5s; cursor: pointer;
        }
        .seal-btn {
            width: 130px; height: 130px; border: 3px solid #c5a059;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 30px; color: #c5a059; box-shadow: 0 0 20px #c5a059;
        }

        /* الخلفية الزمردية اللي بتلمع */
        .page { padding: 40px; text-align: center; background: radial-gradient(circle, #10331e 0%, #011409 100%); min-height: 100vh; }

        /* تنظيم الصور المربعات (الستوري) */
        .story { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 900px; margin: 30px auto; }
        .box { border: 1px solid #c5a059; padding: 8px; background: rgba(0,0,0,0.3); }
        .box img { width: 100%; height: 300px; object-fit: cover; }
        
        .btn-loc { background: #c5a059; color: #011409; padding: 15px 40px; text-decoration: none; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>

    <audio id="music" src="Swany.mp3" loop></audio>

    <div id="envelope" onclick="document.getElementById('music').play(); this.style.opacity='0'; setTimeout(()=>this.style.display='none', 1000)">
        <div class="seal-btn">R & A</div>
    </div>

    <div class="page">
        <h1 style="font-size: 40px;">Wedding of Reem & Amr</h1>
        <p>25 July 2026</p>

        <div class="story">
            <div class="box"><img src="1781194288956.jpeg"></div>
            <div class="box"><img src="1781194320400.jpeg"></div>
        </div>

        <a href="https://maps.app.goo.gl/qVDhujncTiB6yjYX6?g_st=ac" class="btn-loc">مكان القاعة (اللوكيشن)</a>
        
        <div style="margin-top: 40px;">
            <form action="https://formspree.io/f/mbdeanjp" method="POST">
                <textarea name="message" placeholder="أمنياتكم لنا..." style="width: 60%; height: 80px; background: transparent; color: #c5a059; border: 1px solid #c5a059;"></textarea><br>
                <button type="submit" style="background:#c5a059; border:none; padding:10px 20px; margin-top:10px;">إرسال</button>
            </form>
        </div>
    </div>
</body>
</html>
