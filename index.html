<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amr & Reem Wedding Invitation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Montserrat:wght=200;300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff; /* خلينى بيضة وخلى الصورة كلها بيضا */
            --card-bg: #ffffff;
            --text-main: #2b2b2b; 
            --text-muted: #706f6c;
            --accent-gold: #a38f6d; 
        }
        
        * { box-sizing: border-box; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
        }

        audio { display: none !important; }

        /* ✉️ تصميم الجواب الأخضر المشجر الفخم قبل الفتح */
        #envelope-wrapper {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #d2cbbfff;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 1s cubic-bezier(0.76, 0, 0.24, 1);
            opacity: 1;
        }

        .envelope {
            width: 90%;
            max-width: 380px;
            height: 520px;
            background: #4a5d4e; 
            background-image: radial-gradient(rgba(255,255,255,0.15) 1px, transparent 0), radial-gradient(rgba(255,255,255,0.1) 2px, transparent 0);
            background-size: 20px 20px;
            border-radius: 12px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #3b4b3e;
            text-align: center;
            padding: 20px;
        }

        .envelope h2 {
            color: #f4eee1;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            letter-spacing: 4px;
            margin: 0 0 5px;
        }
